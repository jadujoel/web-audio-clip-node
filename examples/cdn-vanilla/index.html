<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CDN Vanilla — web-audio-clip-node</title>
  <style>
    body {
      background: #2b2b2b;
      color: #e8e8e8;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      padding: 48px 20px;
      margin: 0;
    }
    main { max-width: 420px; width: 100%; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p.sub { color: #999; font-size: 0.875rem; margin: 0 0 24px; }
    .controls { display: flex; gap: 8px; margin-bottom: 20px; }
    button {
      padding: 8px 18px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #3a3a3a;
      color: #e8e8e8;
      cursor: pointer;
      font-size: 0.875rem;
    }
    button:hover:not(:disabled) { background: #484848; }
    button:disabled { opacity: 0.4; cursor: default; }
    .status { color: #999; font-size: 0.8rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <main>
    <h1>CDN Vanilla</h1>
    <p class="sub">Zero-build example — loads the library from jsDelivr and plays a generated tone.</p>

    <div class="controls">
      <button id="play">Play</button>
      <button id="pause" disabled>Pause</button>
      <button id="resume" disabled>Resume</button>
    </div>
    <div class="status" id="status">Ready</div>
  </main>

  <script type="module">
    // Ogg Opus at 48 kHz recommended — avoids resampling overhead
    import {
      ClipNode,
      getProcessorCdnUrl,
    } from "https://cdn.jsdelivr.net/npm/@jadujoel/web-audio-clip-node@latest/dist/lib.bundle.js";

    const playBtn = document.getElementById("play");
    const pauseBtn = document.getElementById("pause");
    const resumeBtn = document.getElementById("resume");
    const statusEl = document.getElementById("status");

    let ctx, clip;

    function generateTone(sampleRate, seconds = 2, freq = 440) {
      const length = sampleRate * seconds;
      const buf = new Float32Array(length);
      for (let i = 0; i < length; i++) {
        buf[i] = 0.3 * Math.sin(2 * Math.PI * freq * i / sampleRate)
               * (1 - i / length); // fade out
      }
      return [buf, buf.slice()]; // stereo
    }

    playBtn.onclick = async () => {
      if (!ctx) {
        ctx = new AudioContext({ sampleRate: 48000 });
        await ctx.audioWorklet.addModule(getProcessorCdnUrl());
      }
      await ctx.resume();

      if (clip) { clip.stop(); clip.disconnect(); }

      clip = new ClipNode(ctx, {
        processorOptions: { buffer: generateTone(ctx.sampleRate) },
      });
      clip.connect(ctx.destination);
      clip.onstatechange = (s) => { statusEl.textContent = s; };
      clip.start();

      playBtn.disabled = false;
      pauseBtn.disabled = false;
      resumeBtn.disabled = true;
    };

    pauseBtn.onclick = () => {
      if (clip) clip.pause();
      pauseBtn.disabled = true;
      resumeBtn.disabled = false;
    };

    resumeBtn.onclick = () => {
      if (clip) clip.resume();
      pauseBtn.disabled = false;
      resumeBtn.disabled = true;
    };
  </script>
</body>
</html>
