<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CDN Opus Streaming — web-audio-clip-node</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #2b2b2b;
      color: #e8e8e8;
      font-family: system-ui, sans-serif;
      padding: 24px;
    }
    main { width: min(520px, 100%); }
    h1 { margin: 0 0 8px; font-size: 1.35rem; }
    p { margin: 0 0 16px; color: #b8b8b8; line-height: 1.5; }
    .controls { display: flex; gap: 8px; margin-bottom: 10px; }
    button {
      border: 1px solid #555;
      border-radius: 6px;
      background: #3a3a3a;
      color: #e8e8e8;
      padding: 8px 12px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    #status { color: #9ec2e8; min-height: 1.25em; }
  </style>
</head>
<body>
  <main>
    <h1>CDN Opus Streaming</h1>
    <p>No install and no build. Streams Ogg Opus through <code>ClipNode</code> using the package CDN build.</p>
    <div class="controls">
      <button id="start">Play</button>
    </div>
    <div id="status">Idle</div>
  </main>

  <script type="module">
    import { Coordinator } from "https://cdn.jsdelivr.net/npm/@jadujoel/web-audio-clip-node/dist/lib.bundle.js";

    const btn = document.getElementById("start");
    const status = document.getElementById("status");

    function setStatus(text) {
      status.textContent = text;
    }

    async function main() {
      const coordinator = Coordinator.fromCdn();
      const clip = coordinator.createStreamingClipNode();
      clip.connect(coordinator.context.destination);

      clip.onprogress = (bytes) => {
        const kb = (bytes / 1024) | 0;
        setStatus(`Downloading... ${kb} KB`);
      };
      clip.ondone = () => setStatus("Stream Downloaded.");
      clip.onerror = (msg) => setStatus(`Error: ${msg}`);
      clip.onstarted = () => setStatus("Streaming...");
      clip.onended = () => setStatus("Stream Ended.");

      btn.onclick = async () => {
        clip.url ??= "https://jadujoel.github.io/web-audio-clip-node/sounds/example.opus";
        if (clip.state !== "started") {
          await coordinator.context.resume();
          clip.start();
          btn.innerText = "Stop";
        } else {
          btn.innerText = "Play";
          clip.stop();
        }
      };
    }

    main().catch(err => {
      document.getElementById("status").textContent = `Error: ${err.message}`;
    });
  </script>
</body>
</html>
