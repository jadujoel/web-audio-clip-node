<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CDN Opus Streaming — web-audio-clip-node</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #2b2b2b;
      color: #e8e8e8;
      font-family: system-ui, sans-serif;
      padding: 24px;
    }
    main { width: min(520px, 100%); }
    h1 { margin: 0 0 8px; font-size: 1.35rem; }
    p { margin: 0 0 16px; color: #b8b8b8; line-height: 1.5; }
    .controls { display: flex; gap: 8px; margin-bottom: 10px; }
    button {
      border: 1px solid #555;
      border-radius: 6px;
      background: #3a3a3a;
      color: #e8e8e8;
      padding: 8px 12px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    #status { color: #9ec2e8; min-height: 1.25em; }
  </style>
</head>
<body>
  <main>
    <h1>CDN Opus Streaming</h1>
    <p>No install and no build. Streams Ogg Opus through <code>ClipNode</code> using the package CDN build.</p>
    <div class="controls">
      <button id="start">Start stream</button>
      <button id="stop" disabled>Stop</button>
    </div>
    <div id="status">Idle</div>
  </main>

  <script type="module">
    import {
      Coordinator,
      getProcessorCdnUrl,
    } from "https://cdn.jsdelivr.net/npm/@jadujoel/web-audio-clip-node@latest/dist/lib.bundle.js";

    const OPUS_URL = "https://jadujoel.github.io/web-audio-clip-node/sounds/example.opus";
    const startBtn = document.getElementById("start");
    const stopBtn = document.getElementById("stop");
    const statusEl = document.getElementById("status");

    let coordinator;
    let ctx;
    let clip;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    startBtn.onclick = async () => {
      if (clip) {
        clip.stop();
        clip.disconnect();
        clip = null;
      }

      if (!coordinator) {
        ctx = new AudioContext({ sampleRate: 48000 });
        coordinator = Coordinator.fromContext(ctx);
        await coordinator.addModule(getProcessorCdnUrl());
      }

      await ctx.resume();

      clip = coordinator.StreamingClipNode(undefined, { format: "OggOpus" });
      clip.connect(ctx.destination);

      clip.onprogress = (bytes) => {
        const kb = (bytes / 1024) | 0;
        setStatus(`Downloading... ${kb} KB`);
      };
      clip.ondone = () => setStatus("Stream finished.");
      clip.onerror = (msg) => setStatus(`Error: ${msg}`);
      clip.onstarted = () => setStatus("Streaming and playing...");

      clip.url = OPUS_URL;
      clip.start();

      stopBtn.disabled = false;
      setStatus("Starting stream...");
    };

    stopBtn.onclick = () => {
      if (clip) {
        clip.stop();
        clip.disconnect();
        clip = null;
      }
      setStatus("Stopped");
    };
  </script>
</body>
</html>
