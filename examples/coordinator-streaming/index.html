<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coordinator Streaming — web-audio-clip-node</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #2b2b2b;
      color: #e8e8e8;
      font-family: system-ui, sans-serif;
      padding: 24px;
    }
    main { width: min(520px, 100%); }
    h1 { margin: 0 0 8px; font-size: 1.35rem; }
    p { margin: 0 0 16px; color: #b8b8b8; line-height: 1.5; }
    .controls { display: flex; gap: 8px; margin-bottom: 10px; }
    button {
      border: 1px solid #555;
      border-radius: 6px;
      background: #3a3a3a;
      color: #e8e8e8;
      padding: 8px 12px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    #status { color: #9ec2e8; min-height: 1.25em; }
  </style>
</head>
<body>
  <main>
    <h1>Coordinator Streaming</h1>
    <div class="controls">
      <button id="start">Play</button>
    </div>
    <div id="status">Idle</div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
