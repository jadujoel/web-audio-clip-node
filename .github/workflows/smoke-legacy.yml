name: Smoke Legacy Browsers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - safari_latest_mac
          - safari_14_mac
          - firefox_latest_win10

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run smoke on ${{ matrix.target }}
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: bun smoke-legacy.ts ${{ matrix.target }}
